<script type="text/babel">
const {useState,useEffect,useRef} = React;

const INIT_MEMBERS=[

  {id:2,name:"강희관",status:"정상",customStatus:""},

];
function toArr(v){if(!v)return[];if(Array.isArray(v))return v.filter(Boolean);return Object.values(v).filter(Boolean);}
// Firebase 키(_k)를 보존한 배열로 변환 → 항목 단위 수정/삭제에 사용
function toKeyed(v){const out=[];if(!v)return out;if(Array.isArray(v))v.forEach((x,i)=>{if(x)out.push({...x,_k:String(i)});});else Object.entries(v).forEach(([k,x])=>{if(x)out.push({...x,_k:k});});return out;}
function relTime(ts){if(typeof ts!=="number")return"";const s=(Date.now()-ts)/1000;if(s<60)return"방금 전";if(s<3600)return`${Math.floor(s/60)}분 전`;if(s<86400)return`${Math.floor(s/3600)}시간 전`;if(s<86400*7)return`${Math.floor(s/86400)}일 전`;const d=new Date(ts);return`${d.getMonth()+1}/${d.getDate()}`;}
function bump(path,d){db.ref(path).transaction(c=>Math.max(0,(Number(c)||0)+d));}
// ===== 날씨 (Open-Meteo, API 키 불필요) =====
// 경기장이 모두 서울 시내(도곡·용산·잠실)라 서울 한 지점 예보 사용
const WX_URL="https://api.open-meteo.com/v1/forecast?latitude=37.51&longitude=127.02&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code,wind_speed_10m&wind_speed_unit=ms&timezone=Asia%2FSeoul&forecast_days=16";
function wxDesc(c){
  if(c===0)return["☀️","맑음"];if(c===1)return["🌤️","대체로 맑음"];if(c===2)return["⛅","구름 조금"];if(c===3)return["☁️","흐림"];
  if(c===45||c===48)return["🌫️","안개"];if(c>=51&&c<=57)return["🌦️","이슬비"];if(c>=61&&c<=67)return["🌧️","비"];
  if(c>=71&&c<=77)return["🌨️","눈"];if(c>=80&&c<=82)return["🌦️","소나기"];if(c===85||c===86)return["🌨️","눈 소나기"];if(c>=95)return["⛈️","뇌우"];
  return["🌡️","-"];
}
// 경기 시작 시각(정시 내림)의 예보. 없으면 null
function matchWx(wx,match){
  if(!wx||!match.date||!match.time)return null;
  const i=wx.time.indexOf(`${match.date}T${match.time.slice(0,2)}:00`);
  if(i<0)return null;
  const v=k=>wx[k][i];
  if(v("temperature_2m")==null)return null;
  return{t:Math.round(v("temperature_2m")),feel:Math.round(v("apparent_temperature")),pop:v("precipitation_probability")??0,code:v("weather_code"),wind:Math.round(v("wind_speed_10m"))};
}
function wxTips(w){
  const t=[];
  if(w.pop>=60)t.push("☔ 비 예보 · 우천 진행 여부 확인");
  else if(w.pop>=30)t.push("🌂 비 올 수 있음");
  if(w.feel<=0)t.push("🧤 체감 영하 · 방한 준비");
  if(w.feel>=30)t.push("🥵 더위 주의 · 물 충분히");
  if(w.wind>=9)t.push("💨 강풍");
  return t;
}
function isFuture(match){return new Date(`${match.date}T${match.time||"00:00"}:00+09:00`).getTime()>Date.now();}
function load(key){try{const s=localStorage.getItem(key);return s?JSON.parse(s):null;}catch(e){return null;}}

function StatusBadge({status}){
  const col=status==="정상"?C.purple:status==="부상"?C.red:C.yellow;
  return <span style={{padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:700,background:col+"22",color:col,border:`1px solid ${col}44`}}>{status}</span>;
}

// rank: 공동순위 반영 순위 (공격포인트 0이면 null)
function cardTier(rank){return rank===1?"gold":rank===2?"silver":rank===3?"bronze":"basic";}
const REST={gold:"perspective(900px) rotateX(7deg) rotateY(-5deg)",silver:"perspective(900px) rotateX(5deg) rotateY(-3deg)",bronze:"perspective(900px) rotateX(4deg) rotateY(-2deg)",basic:"none"};
function MvpCard({name,gol,ast,rank}){
  const cardRef=useRef(null);
  const flashRef=useRef(null);
  const ap=gol+ast;
  const tier=cardTier(rank);
  const interactive=tier!=="basic";
  const tag=rank===1?"MVP":rank===2?"2ND":rank===3?"3RD":rank?`#${rank}`:"-";
  function handleMove(e){
    if(!interactive)return;
    const card=cardRef.current;if(!card)return;
    const r=card.getBoundingClientRect();
    const src=e.touches?e.touches[0]:e;
    const dx=(src.clientX-r.left-r.width/2)/(r.width/2);
    const dy=(src.clientY-r.top-r.height/2)/(r.height/2);
    card.style.transform=`perspective(900px) rotateX(${-dy*12}deg) rotateY(${dx*12}deg) scale(1.04)`;
  }
  function handleLeave(){
    if(!interactive)return;
    const card=cardRef.current;if(!card)return;
    card.style.transform=REST[tier];
  }
  function handleClick(){
    if(tier!=="gold")return;
    const card=cardRef.current;if(!card)return;
    const flash=flashRef.current;
    card.style.transform="perspective(900px) rotateX(0deg) rotateY(0deg) scale(1.12)";
    card.style.boxShadow="0 0 0 2px rgba(232,121,249,0.9),0 0 40px rgba(232,121,249,0.7),0 0 80px rgba(192,132,252,0.5),0 20px 60px rgba(100,0,200,0.4)";
    if(flash){flash.style.opacity="1";}
    setTimeout(()=>{
      card.style.transform="perspective(900px) rotateX(7deg) rotateY(-5deg)";
      card.style.boxShadow="";
      if(flash){flash.style.opacity="0";}
    },350);
  }
  return(
    <div className={`mvp-card${tier==="gold"?"":" tier-"+tier}`} style={{transform:REST[tier]}} ref={cardRef} onMouseMove={handleMove} onMouseLeave={handleLeave} onTouchMove={handleMove} onTouchEnd={handleLeave} onClick={handleClick}>
      <div ref={flashRef} style={{position:"absolute",inset:0,background:"linear-gradient(135deg,rgba(255,255,255,0.18),rgba(232,121,249,0.12))",opacity:0,transition:"opacity 0.35s ease",pointerEvents:"none",zIndex:10,borderRadius:"inherit"}}/>
      {tier!=="basic"&&<div className="hex-layer"/>}
      {(tier==="gold"||tier==="silver")&&<div className="shimmer-layer"/>}
      {tier==="gold"&&<div className="stadium-glow"/>}
      {tier!=="basic"&&<div className="bevel-top"/>}
      <div className="card-inner">
        <div className="card-top-row">
          <div>
            <div className="ap-num">{ap}</div>
            <div className="ap-lbl">ATTACK PT</div>
            <div className="rank-tag">{tag}</div>
          </div>
          <div className="logo-wrap">
            <img src={LOGO_SRC} style={{width:34,height:34,objectFit:"cover",mixBlendMode:"screen"}}/>
          </div>
        </div>
        <div className="player-name-kr">{name}</div>
        <div className="glow-line"/>
        <div className="stats-row">
          <div className="stat-col">
            <div className="stat-n gol">{gol}</div>
            <div className="stat-l">GOL</div>
          </div>
          <div className="stat-col">
            <div className="stat-n ast">{ast}</div>
            <div className="stat-l">AST</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [loading,setLoading]=useState(true);
  const [members,setMembers]=useState([]);
  const [matches,setMatches]=useState([]);
  const [goals,setGoals]=useState({});
  const [activity,setActivity]=useState([]);
  const [user,setUser]=useState(load("nfc_user")||null);
  const [pwModal,setPwModal]=useState(false);
  const [pwInput,setPwInput]=useState("");
  const [pwErr,setPwErr]=useState(false);
  const [pendId,setPendId]=useState(null);
  const [tab,setTab]=useState("home");
  const [editMember,setEditMember]=useState(null);
  const [editCustom,setEditCustom]=useState("");
  const [resultEdit,setResultEdit]=useState(null);
  const [resultIn,setResultIn]=useState({our:"",opp:""});
  const [showAddMatch,setShowAddMatch]=useState(false);
  const [newMatch,setNewMatch]=useState({date:"",time:"",location:"",opponent:""});
  const [addMember,setAddMember]=useState(false);
  const [newMemberName,setNewMemberName]=useState("");
  const [goalMatch,setGoalMatch]=useState("");
  const [assists,setAssists]=useState({});
  const [assistMatch,setAssistMatch]=useState("");
  const [mom,setMom]=useState({});
  const [momOpen,setMomOpen]=useState(null);
  const [attendance,setAttendance]=useState({});
  const [attOpen,setAttOpen]=useState(null);
  const [viewId,setViewId]=useState(null);
  const [,setTick]=useState(0);
  const [wx,setWx]=useState(null);

  const isAdmin=user?.isAdmin===true;
  const myId=user?.id;

  useEffect(()=>{
    let done={members:false,matches:false,goals:false,assists:false,actLog:false,mom:false,attendance:false};
    function chk(){if(Object.values(done).every(Boolean))setLoading(false);}
    db.ref("members").on("value",s=>{const v=s.val();if(v)setMembers(toKeyed(v));else db.ref("members").set(INIT_MEMBERS);done.members=true;chk();});
    db.ref("matches").on("value",s=>{setMatches(toKeyed(s.val()));done.matches=true;chk();});
    db.ref("goals").on("value",s=>{setGoals(s.val()||{});done.goals=true;chk();});
    db.ref("assists").on("value",s=>{setAssists(s.val()||{});done.assists=true;chk();});
    db.ref("actLog").on("value",s=>{const a=toArr(s.val()).sort((x,y)=>(y.ts||y.id||0)-(x.ts||x.id||0));setActivity(a);done.actLog=true;chk();});
    db.ref("mom").on("value",s=>{setMom(s.val()||{});done.mom=true;chk();});
    db.ref("attendance").on("value",s=>{setAttendance(s.val()||{});done.attendance=true;chk();});
    const t=setInterval(()=>setTick(x=>x+1),60000);
    return()=>{clearInterval(t);["members","matches","goals","assists","actLog","mom","attendance"].forEach(k=>db.ref(k).off());};
  },[]);

  // 날씨: 30분 캐시, 실패하면 날씨 영역만 숨김
  useEffect(()=>{
    try{const c=JSON.parse(sessionStorage.getItem("nfc_wx")||"null");if(c&&Date.now()-c.at<30*60000){setWx(c.h);return;}}catch(e){}
    fetch(WX_URL).then(r=>r.ok?r.json():null).then(d=>{if(!d||!d.hourly)return;setWx(d.hourly);try{sessionStorage.setItem("nfc_wx",JSON.stringify({at:Date.now(),h:d.hourly}));}catch(e){}}).catch(()=>{});
  },[]);

  useEffect(()=>{try{if(user)localStorage.setItem("nfc_user",JSON.stringify(user));else localStorage.removeItem("nfc_user");}catch(e){}},[user]);

  // 트랜잭션: 동시에 여러 명이 기록해도 서로 덮어쓰지 않음
  function addLog(msg){const now=Date.now();db.ref("actLog").transaction(cur=>[{id:now,ts:now,msg},...toArr(cur).slice(0,19)]);}
  function selectMember(m){if(m.id===ADMIN_ID){setPendId(m.id);setPwModal(true);setPwInput("");setPwErr(false);}else setUser({id:m.id,name:m.name,isAdmin:false});}
  function submitPw(){if(pwInput===ADMIN_PW){const m=members.find(x=>x.id===pendId);setUser({id:pendId,name:m.name,isAdmin:true});setPwModal(false);setPwInput("");setPwErr(false);}else setPwErr(true);}

  // 존재하는 경기의 기록만 합산 (삭제된 경기의 잔여 기록 제외)
  const matchIds=new Set(matches.map(m=>String(m.id)));
  const memberById={};members.forEach(m=>{memberById[String(m.id)]=m;});
  function sumFor(src,memberId){return Object.entries(src).reduce((s,[mid,mg])=>s+(matchIds.has(mid)&&mg&&mg[memberId]?Number(mg[memberId])||0:0),0);}
  function getPlayerGoals(memberId){return sumFor(goals,memberId);}
  function getPlayerAssists(memberId){return sumFor(assists,memberId);}
  // 참석자: attendance/{경기id}/{멤버id}=true
  function isAttending(matchId,memberId){const a=attendance[matchId];return !!(a&&a[memberId]);}
  function attendIds(matchId){const a=attendance[matchId]||{};return members.filter(m=>a[m.id]).map(m=>String(m.id));}
  // 유효표: 투표자·후보 모두 현재 멤버이고 참석자일 것 (참석자 미등록 경기는 예전 표 그대로 인정)
  function validVotes(matchId){
    const hasAtt=attendIds(matchId).length>0;
    return Object.entries(mom[matchId]||{}).filter(([v,c])=>c!=null&&memberById[v]&&memberById[String(c)]&&(!hasAtt||(isAttending(matchId,v)&&isAttending(matchId,c))));
  }
  function momTally(matchId){const cnt={};validVotes(matchId).forEach(([,c])=>{const k=String(c);cnt[k]=(cnt[k]||0)+1;});return cnt;}
  function setAttend(match,memberId,on){db.ref(`attendance/${match.id}/${memberId}`).set(on?true:null);}
  function setAttendAll(match,on){const u={};members.forEach(m=>{u[m.id]=on?true:null;});db.ref(`attendance/${match.id}`).update(u);}
  function momWinners(matchId){const cnt=momTally(matchId);const max=Math.max(0,...Object.values(cnt));return max?Object.keys(cnt).filter(k=>cnt[k]===max):[];}
  function getPlayerMom(memberId){return matches.filter(m=>m.result&&m.momClosed&&momWinners(m.id).includes(String(memberId))).length;}
  const ranked=members
    .map(m=>({...m,g:getPlayerGoals(m.id),a:getPlayerAssists(m.id),mom:getPlayerMom(m.id)}))
    .map(m=>({...m,ap:m.g+m.a}))
    .sort((a,b)=>b.ap-a.ap||b.g-a.g);
  // 공동순위: 공격포인트·골이 모두 같으면 같은 순위, 공격포인트 0이면 순위 없음
  ranked.forEach(m=>{m.rank=m.ap>0?1+ranked.filter(o=>o.ap>m.ap||(o.ap===m.ap&&o.g>m.g)).length:null;});
  function openProfile(id){setViewId(id);setTab("player");window.scrollTo(0,0);}
  function deleteMatch(match){

  const iS={background:"rgba(60,0,100,0.4)",border:`1px solid ${C.border}`,borderRadius:12,padding:"10px 14px",color:"#fff",fontSize:14,outline:"none",fontFamily:"inherit",width:"100%",boxSizing:"border-box"};
  const btnP={background:`linear-gradient(135deg,${C.purple2},${C.purple})`,border:"none",borderRadius:12,padding:"12px",color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer",width:"100%",boxShadow:`0 4px 20px rgba(168,85,247,0.35)`};

  const nextMatch=[...matches].filter(m=>!m.result).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const activeCount=members.filter(m=>!m.status||m.status==="정상").length;

    backdropFilter:"blur(10px)",WebkitBackdropFilter:"blur(10px)"

  const pill=(primary)=>({background:primary?`linear-gradient(135deg,${C.purple2},${C.purple})`:"rgba(60,0,100,0.4)",border:primary?"none":`1px solid ${C.border}`,borderRadius:20,padding:"5px 12px",color:primary?"#fff":C.sub,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",flexShrink:0,whiteSpace:"nowrap"});

  function dday(match){const t=new Date(`${match.date}T00:00:00+09:00`).getTime();const n=new Date(Date.now()+9*3600000);const today=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate())-9*3600000;const d=Math.round((t-today)/86400000);return d===0?"D-DAY":d>0?`D-${d}`:null;}
  function renderMatch(match){
    const res=match.result;

            )}

        </div>

        {/* 날씨 */}
        {!res&&isFuture(match)&&(w?(()=>{const[ic,lb]=wxDesc(w.code);const tips=wxTips(w);return(
          <div style={{...rowS,justifyContent:"flex-start",flexWrap:"wrap"}}>
            <span style={{fontSize:13,fontWeight:700,whiteSpace:"nowrap"}}>{ic} {w.t}° {lb}</span>
            <span style={{fontSize:11,color:C.sub}}>체감 {w.feel}° · 강수 {w.pop}% · 바람 {w.wind}m/s</span>
            {tips.map(t=><span key={t} style={{fontSize:11,color:"#fff",background:"rgba(56,189,248,0.15)",borderRadius:10,padding:"2px 8px"}}>{t}</span>)}
          </div>);})():(wx&&<div style={{...rowS,justifyContent:"flex-start"}}><span style={{fontSize:11,color:C.dim}}>🌤️ 날씨는 경기 16일 전부터 볼 수 있어요</span></div>))}

        {/* 참석 */}

            <span style={{fontSize:13,fontWeight:900,color:C.purple}}>👥 참석 {att.length}명</span>

            {isAdmin&&<button onClick={()=>setAttOpen(attEdit?null:match.id)} style={pill(false)}>{attEdit?"닫기":"설정"}</button>}
          </div>
        </div>
        {att.length>0&&!attEdit&&<div style={{display:"flex",flexWrap:"wrap",gap:5,margin:"-4px 0 10px"}}>{att.map(k=><span key={k} style={{fontSize:11,color:k===String(myId)?C.pink:"#fff",background:"rgba(60,0,100,0.45)",borderRadius:10,padding:"2px 8px"}}>{memberById[k].name}</span>)}</div>}
        {attEdit&&(

              {members.map(c=>{const on=att.includes(String(c.id));return <button key={c.id} onClick={()=>setAttend(match,c.id,!on)} style={gridBtn(on)}>{c.name}</button>;})}

        {/* MOM (결과 입력된 경기) */}
        {res&&(<>
          <div style={rowS}>
            <div style={{minWidth:0,flex:1}}>
              <span style={{fontSize:13,fontWeight:900,color:C.yellow}}>🏅 MOM{locked?"":" 투표중"}</span>
              {locked?(
                winners.length?<span style={{fontSize:14,fontWeight:900,marginLeft:8}}>{winners.map(k=>memberById[k].name).join(", ")} <span style={{fontSize:11,color:C.sub,fontWeight:400}}>{tally[winners[0]]}표 · {voters}명 참여</span></span>
                :<span style={{fontSize:12,color:C.sub,marginLeft:8}}>투표 없음</span>
              ):(
                <span style={{fontSize:12,color:C.sub,marginLeft:8}}>{voters}명 참여{myValid?` · 내 투표: ${memberById[myVote].name}`:""}{hint&&<span style={{color:C.dim}}> · {hint}</span>}</span>
              )}
            </div>
            <div style={{display:"flex",gap:6,flexShrink:0}}>
              {canVote&&<button onClick={()=>setMomOpen(voteOpen?null:match.id)} style={{...pill(!voteOpen),background:voteOpen?"rgba(60,0,100,0.4)":"linear-gradient(135deg,#b45309,#fbbf24)"}}>{voteOpen?"닫기":myValid?"변경":"투표"}</button>}
              {isAdmin&&<button onClick={()=>{toggleMomClose(match);setMomOpen(null);}} style={pill(false)}>{locked?"재개":"마감"}</button>}
            </div>
          </div>
          {locked&&Object.keys(tally).length>1&&(
            <div style={{display:"flex",flexWrap:"wrap",gap:5,margin:"-4px 0 10px"}}>
              {Object.entries(tally).sort((a,b)=>b[1]-a[1]).map(([k,n])=><span key={k} style={{fontSize:11,color:C.sub,background:"rgba(60,0,100,0.35)",borderRadius:10,padding:"2px 8px"}}>{memberById[k].name} {n}</span>)}
            </div>
          )}
          {voteOpen&&(
            <div style={{paddingBottom:10}}>
              <div style={{fontSize:11,color:C.sub,marginBottom:8}}>참석자 중 본인 제외 · 다시 누르면 취소 · 결과는 마감 후 공개</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
                {members.filter(c=>c.id!==myId&&att.includes(String(c.id))).map(c=><button key={c.id} onClick={()=>voteMom(match,c.id)} style={gridBtn(myVote===String(c.id),true)}>{c.name}</button>)}
              </div>

        {/* 관리자: 결과 입력/수정 · 삭제 (작은 텍스트 버튼) */}
        {isAdmin&&(<>
                  {isAdmin&&resultEdit===match.id&&(
                    <div style={{background:"rgba(60,0,100,0.4)",borderRadius:12,padding:12,margin:"4px 0 10px",border:`1px solid ${C.border}`}}>

                        <div style={{flex:1,textAlign:"center"}}><div style={{fontSize:11,color:C.sub,marginBottom:6}}>우리팀</div><input type="number" min="0" value={resultIn.our} onChange={e=>setResultIn({...resultIn,our:e.target.value})} style={{...iS,textAlign:"center",fontSize:24,fontWeight:900,padding:"8px"}}/></div>

                        <div style={{flex:1,textAlign:"center"}}><div style={{fontSize:11,color:C.sub,marginBottom:6}}>{match.opponent||"상대팀"}</div><input type="number" min="0" value={resultIn.opp} onChange={e=>setResultIn({...resultIn,opp:e.target.value})} style={{...iS,textAlign:"center",fontSize:24,fontWeight:900,padding:"8px"}}/></div>
                      </div>

                        <button onClick={()=>{const our=parseInt(resultIn.our),opp=parseInt(resultIn.opp);if(isNaN(our)||isNaN(opp))return;const outcome=our>opp?"win":our<opp?"lose":"draw";db.ref(`matches/${match._k}/result`).set({our,opp,outcome});addLog(`vs ${match.opponent||"상대팀"} ${our}-${opp} ${RL[outcome]}`);setResultEdit(null);setResultIn({our:"",opp:""}); }} style={{...btnP,flex:1,padding:"9px"}}>저장</button>

  if(loading)return(

  if(!user)return(
    <div style={{background:C.bg,minHeight:"100vh",padding:24,maxWidth:480,margin:"0 auto"}}>
      {pwModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(7,0,15,0.9)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:20,backdropFilter:"blur(8px)"}}>
          <div style={{background:"linear-gradient(135deg,#1a003a,#0e0025)",borderRadius:24,padding:28,width:"100%",maxWidth:320,border:`1px solid rgba(168,85,247,0.4)`,boxShadow:`0 20px 60px rgba(124,58,237,0.3)`}}>

                            <div style={{fontSize:12,color:C.sub,marginBottom:8}}>상태</div>
                            <div style={{display:"flex",gap:8,marginBottom:10}}>
                              {["정상","부상","휴식"].map(s=>{const col=s==="정상"?C.purple:s==="부상"?C.red:C.yellow;return(<button key={s} onClick={()=>{db.ref(`members/${m._k}`).update({status:s});addLog(`${m.name} 상태 → ${s}`);}} style={{flex:1,background:m.status===s?col+"33":"rgba(60,0,100,0.3)",border:`1px solid ${m.status===s?col+"66":C.border}`,borderRadius:10,padding:"7px",color:m.status===s?col:C.sub,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{s}</button>);})}
                            </div>
                            <div style={{display:"flex",gap:8,marginBottom:m.id!==ADMIN_ID?10:0}}>
                              <input value={editCustom} onChange={e=>setEditCustom(e.target.value)} placeholder="메모 직접입력 (예: 12월 복귀)" style={{...iS,flex:1}}/>
                              <button onClick={()=>db.ref(`members/${m._k}`).update({customStatus:editCustom.trim()})} style={{...btnP,width:"auto",padding:"10px 14px"}}>적용</button>
                            </div>
                            {m.id!==ADMIN_ID&&<button onClick={()=>{if(confirm(`${m.name}님을 삭제할까요?`)){db.ref(`members/${m._k}`).remove();addLog(`멤버 삭제: ${m.name}`);setEditMember(null);}}} style={{...btnG,width:"100%",color:C.red,borderColor:C.red+"44"}}>멤버 삭제</button>}
                          </div>
                        )}
                      </div>))}
                    </div>
                  </>
                )}
              </div>
          </div>
        )}

      </div>

      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"rgba(7,0,15,0.95)",borderTop:`1px solid rgba(168,85,247,0.25)`,display:"flex",padding:"6px 0 10px",zIndex:100,backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)"}}>
        {[["home","⚽","홈"],["match","📅","경기"],["stats","🏆","스탯"],["my","👤","MY"],...(isAdmin?[["manage","📋","관리"]]:[])].map(([key,icon,label])=>{
          const active=key==="my"?(tab==="player"&&String(viewId)===String(myId)):key==="stats"?(tab==="stats"||(tab==="player"&&String(viewId)!==String(myId))):tab===key;
          return(
          <button key={key} onClick={()=>key==="my"?openProfile(myId):setTab(key)} style={{flex:1,background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"4px 0"}}>
            <span style={{fontSize:22}}>{icon}</span>
            <span style={{fontSize:9,fontWeight:active?700:400,color:active?C.purple:C.dim}}>{label}</span>
          </button>
        );})}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
