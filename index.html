    .glow-line{height:1px;background:linear-gradient(90deg,transparent,rgba(180,100,255,0.6),rgba(232,121,249,0.8),rgba(180,100,255,0.6),transparent);margin:0 8px 14px;box-shadow:0 0 8px rgba(200,100,255,0.5);}
    .stats-row{display:flex;justify-content:center;gap:24px;}

<script type="text/babel">
const {useState,useEffect,useRef} = React;
const db = window._db;

const ADMIN_ID=1,ADMIN_PW="1886",DUE_AMT=20000;
const C={
  bg:"#07000f",card:"#100020",card2:"#180030",
  purple:"#c084fc",purple2:"#7c3aed",pink:"#e879f9",
  red:"#f87171",yellow:"#fbbf24",border:"#3b0764",sub:"#a78bca",dim:"#6d3f9e"
};
const LOGO_SRC="./나인티즈_로고.png";

function getMonths(n=12){
  const res=[],base=new Date(2026,11,1);
  for(let i=0;i<n;i++){const d=new Date(base.getFullYear(),base.getMonth()-i,1);res.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);}
  return res;
}
const MONTHS=getMonths(12);
const DOT_MONTHS=MONTHS.slice(0,5);
function mLabel(m){const[y,mo]=m.split("-");return `${y}년 ${+mo}월`;}

const INIT_MEMBERS=[
  {id:1,name:"김민형",status:"정상",customStatus:""},
  {id:2,name:"강희관",status:"정상",customStatus:""},
  {id:3,name:"곽종현",status:"정상",customStatus:""},
  {id:4,name:"김성준",status:"정상",customStatus:""},
  {id:5,name:"김재민",status:"정상",customStatus:""},
  {id:6,name:"김효태",status:"정상",customStatus:""},
  {id:7,name:"배성록",status:"정상",customStatus:""},
  {id:8,name:"오성택",status:"정상",customStatus:""},
  {id:9,name:"유세원",status:"정상",customStatus:""},
  {id:10,name:"윤준범",status:"정상",customStatus:""},
  {id:11,name:"이원준",status:"정상",customStatus:""},
  {id:12,name:"이정기",status:"정상",customStatus:""},
  {id:13,name:"이희승",status:"정상",customStatus:""},
  {id:14,name:"임종철",status:"정상",customStatus:""},
  {id:15,name:"류진엽",status:"정상",customStatus:""},
  {id:16,name:"정오성",status:"정상",customStatus:""},
  {id:17,name:"조성훈",status:"정상",customStatus:""},
  {id:18,name:"한호성",status:"정상",customStatus:""},
];
function initDues(members){
  const d={};MONTHS.forEach(m=>{d[m]={};members.forEach(mb=>{d[m][mb.id]={paid:false,amount:0};});});return d;
}
function toArr(v){if(!v)return[];if(Array.isArray(v))return v.filter(Boolean);return Object.values(v).filter(Boolean);}
function load(key){try{const s=localStorage.getItem(key);return s?JSON.parse(s):null;}catch(e){return null;}}

function StatusBadge({status}){
  const col=status==="정상"?C.purple:status==="부상"?C.red:C.yellow;
  return <span style={{padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:700,background:col+"22",color:col,border:`1px solid ${col}44`}}>{status}</span>;
}

function MvpCard({name,gol,ast}){
  const cardRef=useRef(null);
  const flashRef=useRef(null);
  const ap=gol+ast;
  function handleMove(e){
    const card=cardRef.current;if(!card)return;
    const r=card.getBoundingClientRect();
    const src=e.touches?e.touches[0]:e;
    const dx=(src.clientX-r.left-r.width/2)/(r.width/2);
    const dy=(src.clientY-r.top-r.height/2)/(r.height/2);
    card.style.transform=`perspective(900px) rotateX(${-dy*12}deg) rotateY(${dx*12}deg) scale(1.04)`;
  }
  function handleLeave(){
    const card=cardRef.current;if(!card)return;
    card.style.transform="perspective(900px) rotateX(7deg) rotateY(-5deg)";
  }
  function handleClick(){
    const card=cardRef.current;if(!card)return;
    const flash=flashRef.current;
    card.style.transform="perspective(900px) rotateX(0deg) rotateY(0deg) scale(1.12)";
    card.style.boxShadow="0 0 0 2px rgba(232,121,249,0.9),0 0 40px rgba(232,121,249,0.7),0 0 80px rgba(192,132,252,0.5),0 20px 60px rgba(100,0,200,0.4)";
    if(flash){flash.style.opacity="1";}
    setTimeout(()=>{
      card.style.transform="perspective(900px) rotateX(7deg) rotateY(-5deg)";
      card.style.boxShadow="";
      if(flash){flash.style.opacity="0";}
    },350);
  }
  return(
    <div className="mvp-card" ref={cardRef} onMouseMove={handleMove} onMouseLeave={handleLeave} onTouchMove={handleMove} onTouchEnd={handleLeave} onClick={handleClick}>
      <div ref={flashRef} style={{position:"absolute",inset:0,background:"linear-gradient(135deg,rgba(255,255,255,0.18),rgba(232,121,249,0.12))",opacity:0,transition:"opacity 0.35s ease",pointerEvents:"none",zIndex:10,borderRadius:"inherit"}}/>
      <div className="hex-layer"/>
      <div className="shimmer-layer"/>
      <div className="stadium-glow"/>
      <div className="bevel-top"/>
      <div className="card-inner">
        <div className="card-top-row">
          <div>
            <div className="ap-num">{ap}</div>
            <div className="ap-lbl">ATTACK PT</div>
          </div>
          <div className="logo-wrap">
            <img src={LOGO_SRC} style={{width:34,height:34,objectFit:"cover",mixBlendMode:"screen"}}/>
          </div>
        </div>
        <div className="player-name-kr">{name}</div>
        <div className="glow-line"/>
        <div className="stats-row">
          <div className="stat-col">
            <div className="stat-n gol">{gol}</div>
            <div className="stat-l">GOL</div>
          </div>
          <div className="stat-col">
            <div className="stat-n ast">{ast}</div>
            <div className="stat-l">AST</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [loading,setLoading]=useState(true);
  const [members,setMembers]=useState([]);
  const [dues,setDues]=useState({});
  const [matches,setMatches]=useState([]);
  const [goals,setGoals]=useState({});
  const [activity,setActivity]=useState([]);
  const [user,setUser]=useState(load("nfc_user")||null);
  const [pwModal,setPwModal]=useState(false);
  const [pwInput,setPwInput]=useState("");
  const [pwErr,setPwErr]=useState(false);
  const [pendId,setPendId]=useState(null);
  const [tab,setTab]=useState("home");
  const [manTab,setManTab]=useState("dues");
  const [dueMonth,setDueMonth]=useState(MONTHS[0]);
  const [editDue,setEditDue]=useState(null);
  const [editAmt,setEditAmt]=useState("");
  const [editCustom,setEditCustom]=useState("");
  const [resultEdit,setResultEdit]=useState(null);
  const [resultIn,setResultIn]=useState({our:"",opp:""});
  const [showAddMatch,setShowAddMatch]=useState(false);
  const [newMatch,setNewMatch]=useState({date:"",time:"",location:"",opponent:""});
  const [addMember,setAddMember]=useState(false);
  const [newMemberName,setNewMemberName]=useState("");
  const [goalMatch,setGoalMatch]=useState("");
  const [assists,setAssists]=useState({});
  const [assistMatch,setAssistMatch]=useState("");
  const actRef=useRef([]);

  const isAdmin=user?.isAdmin===true;
  const myId=user?.id;

  useEffect(()=>{
    let done={members:false,dues:false,matches:false,goals:false,assists:false,actLog:false};
    function chk(){if(Object.values(done).every(Boolean))setLoading(false);}
    db.ref("members").on("value",s=>{const v=s.val();if(v)setMembers(toArr(v));else db.ref("members").set(INIT_MEMBERS);done.members=true;chk();});
    db.ref("dues").on("value",s=>{const v=s.val();if(v)setDues(v);else db.ref("dues").set(initDues(INIT_MEMBERS));done.dues=true;chk();});
    db.ref("matches").on("value",s=>{setMatches(s.val()?toArr(s.val()):[]);done.matches=true;chk();});
    db.ref("goals").on("value",s=>{setGoals(s.val()||{});done.goals=true;chk();});
    db.ref("assists").on("value",s=>{setAssists(s.val()||{});done.assists=true;chk();});
    db.ref("actLog").on("value",s=>{const a=s.val()?toArr(s.val()):[];setActivity(a);actRef.current=a;done.actLog=true;chk();});
    return()=>["members","dues","matches","goals","assists","actLog"].forEach(k=>db.ref(k).off());
  },[]);

  useEffect(()=>{try{if(user)localStorage.setItem("nfc_user",JSON.stringify(user));else localStorage.removeItem("nfc_user");}catch(e){}},[user]);

  function addLog(msg){db.ref("actLog").set([{id:Date.now(),msg,time:"방금 전"},...actRef.current.slice(0,19)]);}
  function selectMember(m){if(m.id===ADMIN_ID){setPendId(m.id);setPwModal(true);setPwInput("");setPwErr(false);}else setUser({id:m.id,name:m.name,isAdmin:false});}
  function submitPw(){if(pwInput===ADMIN_PW){const m=members.find(x=>x.id===pendId);setUser({id:pendId,name:m.name,isAdmin:true});setPwModal(false);setPwInput("");setPwErr(false);}else setPwErr(true);}

  function getPlayerGoals(memberId){return Object.values(goals).reduce((s,mg)=>s+(mg&&mg[memberId]?Number(mg[memberId]):0),0);}
  function getPlayerAssists(memberId){return Object.values(assists).reduce((s,ma)=>s+(ma&&ma[memberId]?Number(ma[memberId]):0),0);}

  const iS={background:"rgba(60,0,100,0.4)",border:`1px solid ${C.border}`,borderRadius:12,padding:"10px 14px",color:"#fff",fontSize:14,outline:"none",fontFamily:"inherit",width:"100%",boxSizing:"border-box"};
  const btnP={background:`linear-gradient(135deg,${C.purple2},${C.purple})`,border:"none",borderRadius:12,padding:"12px",color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer",width:"100%",boxShadow:`0 4px 20px rgba(168,85,247,0.35)`};
  const btnG={background:"rgba(60,0,100,0.3)",border:`1px solid ${C.border}`,borderRadius:12,padding:"10px",color:C.sub,fontWeight:600,fontSize:13,cursor:"pointer",flex:1};

  const _now=new Date();
  const thisMonth=`${_now.getFullYear()}-${String(_now.getMonth()+1).padStart(2,"0")}`;
  const thisDues=dues[thisMonth]||{};
  const paidCount=Object.values(thisDues).filter(d=>d?.paid).length;
  const totalPaid=Object.values(thisDues).reduce((s,d)=>s+(d?.paid?d.amount:0),0);
  const nextMatch=[...matches].filter(m=>!m.result).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const activeCount=members.filter(m=>!m.status||m.status==="정상").length;
  const RC={win:C.purple,lose:C.red,draw:C.yellow},RL={win:"승",lose:"패",draw:"무"};

  const glassCard={
    background:"linear-gradient(135deg,rgba(168,85,247,0.12),rgba(109,40,217,0.05))",
    border:`1px solid rgba(168,85,247,0.2)`,borderRadius:16,padding:"14px 16px",
    backdropFilter:"blur(10px)",WebkitBackdropFilter:"blur(10px)"
  };

  if(loading)return(
    <div style={{background:C.bg,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
      <div style={{width:80,height:80,borderRadius:"50%",overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 0 40px rgba(168,85,247,0.5)`,border:`2px solid rgba(168,85,247,0.4)`}}>
        <img src={LOGO_SRC} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
      </div>
      <div style={{fontSize:22,fontWeight:900,background:`linear-gradient(90deg,${C.purple},${C.pink})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Ninetyz FC</div>
      <div style={{fontSize:13,color:C.sub}}>불러오는 중...</div>
    </div>
  );

  if(!user)return(
    <div style={{background:C.bg,minHeight:"100vh",padding:24,maxWidth:480,margin:"0 auto"}}>
      {pwModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(7,0,15,0.9)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:20,backdropFilter:"blur(8px)"}}>
          <div style={{background:"linear-gradient(135deg,#1a003a,#0e0025)",borderRadius:24,padding:28,width:"100%",maxWidth:320,border:`1px solid rgba(168,85,247,0.4)`,boxShadow:`0 20px 60px rgba(124,58,237,0.3)`}}>
            <div style={{fontSize:22,textAlign:"center",marginBottom:8}}>🔐</div>
            <div style={{fontSize:16,fontWeight:900,textAlign:"center",marginBottom:4}}>관리자 확인</div>
            <div style={{fontSize:12,color:C.sub,textAlign:"center",marginBottom:20}}>비밀번호 입력</div>
            <input type="password" value={pwInput} onChange={e=>{setPwInput(e.target.value);setPwErr(false);}} onKeyDown={e=>e.key==="Enter"&&submitPw()} autoFocus style={{...iS,textAlign:"center",fontSize:20,letterSpacing:6,marginBottom:8}}/>
            {pwErr&&<div style={{fontSize:12,color:C.red,textAlign:"center",marginBottom:8}}>비밀번호가 틀렸습니다</div>}
            <div style={{display:"flex",gap:8,marginTop:4}}>
              <button onClick={()=>{setPwModal(false);setPwInput("");setPwErr(false);}} style={{...btnG}}>취소</button>
              <button onClick={submitPw} style={{...btnP,flex:1,padding:"10px"}}>확인</button>
            </div>
          </div>
        </div>
      )}
      <div style={{textAlign:"center",marginBottom:32,paddingTop:20}}>
        <div style={{width:80,height:80,borderRadius:"50%",overflow:"hidden",margin:"0 auto 16px",boxShadow:`0 0 40px rgba(168,85,247,0.5)`,border:`2px solid rgba(168,85,247,0.4)`}}>
          <img src={LOGO_SRC} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
        </div>
        <div style={{fontSize:26,fontWeight:900,background:`linear-gradient(90deg,${C.purple},${C.pink})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Ninetyz FC</div>
        <div style={{fontSize:13,color:C.sub,marginTop:6}}>이름을 눌러 입장하세요</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
        {members.map(m=>(
          <button key={m.id} onClick={()=>selectMember(m)} style={{background:"linear-gradient(135deg,rgba(124,58,237,0.15),rgba(168,85,247,0.08))",border:`1px solid rgba(168,85,247,0.25)`,borderRadius:14,padding:"14px 8px",color:"#fff",cursor:"pointer",fontFamily:"inherit",textAlign:"center",backdropFilter:"blur(8px)"}}>
            <div style={{fontSize:13,fontWeight:700}}>{m.name}</div>
            {m.id===ADMIN_ID&&<div style={{fontSize:10,color:C.purple,marginTop:3}}>🔐 관리자</div>}
            {m.status&&m.status!=="정상"&&<div style={{fontSize:10,color:m.status==="부상"?C.red:C.yellow,marginTop:3}}>{m.status}</div>}
          </button>
        ))}
      </div>
    </div>
  );

  return(
    <div style={{background:C.bg,minHeight:"100vh",maxWidth:480,margin:"0 auto",color:"#fff",position:"relative"}}>
      <div style={{background:"linear-gradient(180deg,rgba(124,58,237,0.3),rgba(7,0,15,0.9))",padding:"16px",borderBottom:`1px solid rgba(168,85,247,0.2)`,position:"sticky",top:0,zIndex:100,backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:44,height:44,borderRadius:"50%",overflow:"hidden",boxShadow:`0 0 16px rgba(168,85,247,0.5)`,border:`2px solid rgba(168,85,247,0.4)`}}>
              <img src={LOGO_SRC} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
            </div>
            <div>
              <div style={{fontWeight:900,fontSize:18,background:`linear-gradient(90deg,${C.purple},${C.pink})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Ninetyz FC</div>
              <div style={{fontSize:11,color:C.sub}}>멤버 {members.length}명 · {isAdmin?"관리자 ⚙️ ":""}{user.name}</div>

                            <div style={{fontSize:12,color:C.sub,marginBottom:8}}>상태</div>
                            <div style={{display:"flex",gap:8,marginBottom:10}}>
                              {["정상","부상","휴식"].map(s=>{const col=s==="정상"?C.purple:s==="부상"?C.red:C.yellow;return(<button key={s} onClick={()=>{db.ref("members").set(members.map(p=>p.id===m.id?{...p,status:s}:p));addLog(`${m.name} 상태 → ${s}`);}} style={{flex:1,background:m.status===s?col+"33":"rgba(60,0,100,0.3)",border:`1px solid ${m.status===s?col+"66":C.border}`,borderRadius:10,padding:"7px",color:m.status===s?col:C.sub,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{s}</button>);})}
                            </div>
                            <div style={{display:"flex",gap:8}}>
                              <input value={editCustom} onChange={e=>setEditCustom(e.target.value)} placeholder="직접입력" style={{...iS,flex:1}}/>
                              <button onClick={()=>db.ref("members").set(members.map(p=>p.id===m.id?{...p,customStatus:editCustom}:p))} style={{...btnP,width:"auto",padding:"10px 14px"}}>적용</button>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {manTab==="team"&&(
              <div>
                {!isAdmin?(<div style={{...glassCard,textAlign:"center",padding:"30px 20px"}}><div style={{fontSize:32,marginBottom:12}}>🔒</div><div style={{fontSize:14,fontWeight:700,marginBottom:6}}>관리자 전용</div><div style={{fontSize:12,color:C.sub}}>팀 관리는 관리자만 접근 가능합니다</div></div>):(
                  <>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                      <span style={{fontSize:13,color:C.sub}}>멤버 목록</span>
                      <div style={{display:"flex",gap:8}}>
                        <button onClick={()=>{if(confirm("멤버를 기본 18명으로 초기화할까요?\n기존 데이터는 사라집니다.")){db.ref("members").set(INIT_MEMBERS);addLog("멤버 초기화 완료");}}} style={{background:C.red+"22",border:`1px solid ${C.red}44`,borderRadius:20,padding:"7px 14px",color:C.red,fontSize:12,fontWeight:700,cursor:"pointer"}}>초기화</button>
                        <button onClick={()=>setAddMember(!addMember)} style={{...btnP,width:"auto",padding:"7px 16px",fontSize:12,borderRadius:20}}>+ 멤버 추가</button>
                      </div>
                    </div>
                    {addMember&&<div style={{...glassCard,marginBottom:12}}><div style={{display:"flex",gap:8}}><input value={newMemberName} onChange={e=>setNewMemberName(e.target.value)} placeholder="이름 입력" style={{...iS,flex:1}}/><button onClick={()=>{if(!newMemberName.trim())return;const nm={id:Date.now(),name:newMemberName,status:"정상",customStatus:""};db.ref("members").set([...members,nm]);const nd={...dues};MONTHS.forEach(m=>{if(!nd[m])nd[m]={};nd[m][nm.id]={paid:false,amount:0};});db.ref("dues").set(nd);addLog(`멤버 추가: ${newMemberName}`);setNewMemberName("");setAddMember(false);}} style={{...btnP,width:"auto",padding:"10px 14px"}}>추가</button><button onClick={()=>setAddMember(false)} style={{...btnG,width:"auto",padding:"10px 12px"}}>취소</button></div></div>}
                    <div style={glassCard}>
                      {members.map(m=>(<div key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 0",borderBottom:`1px solid rgba(59,7,100,0.6)`}}>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <span style={{fontSize:15,fontWeight:600}}>{m.name}</span>
                          {m.id===ADMIN_ID&&<span style={{background:C.purple+"33",color:C.purple,fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:10}}>관리자</span>}
                          {m.id===myId&&<span style={{background:C.pink+"33",color:C.pink,fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:10}}>나</span>}
                          {m.status&&m.status!=="정상"&&<StatusBadge status={m.status}/>}
                        </div>
                        {m.id!==ADMIN_ID&&<button onClick={()=>{if(confirm(`${m.name}님을 삭제할까요?`)){db.ref("members").set(members.filter(x=>x.id!==m.id));addLog(`멤버 삭제: ${m.name}`);}}} style={{background:C.red+"22",border:`1px solid ${C.red}44`,borderRadius:10,padding:"4px 12px",color:C.red,fontSize:12,fontWeight:700,cursor:"pointer"}}>삭제</button>}
                      </div>))}
                    </div>
                  </>
                )}
              </div>
            )}
          </div>
        )}

      </div>

      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"rgba(7,0,15,0.95)",borderTop:`1px solid rgba(168,85,247,0.25)`,display:"flex",padding:"6px 0 10px",zIndex:100,backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)"}}>
        {[["home","⚽","홈"],["match","📅","경기"],["stats","🏆","스탯"],["manage","📋","관리"]].map(([key,icon,label])=>(
          <button key={key} onClick={()=>setTab(key)} style={{flex:1,background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"4px 0"}}>
            <span style={{fontSize:22}}>{icon}</span>
            <span style={{fontSize:9,fontWeight:tab===key?700:400,color:tab===key?C.purple:C.dim}}>{label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
