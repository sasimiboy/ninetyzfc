  for(let i=0;i<n;i++){const d=new Date(base.getFullYear(),base.getMonth()-i,1);res.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);}
  return res;
}

function mLabel(m){const[y,mo]=m.split("-");return `${y}년 ${+mo}월`;}

function initDues(members){
  const d={};MONTHS.forEach(m=>{d[m]={};members.forEach(mb=>{d[m][mb.id]={paid:false,amount:0};});});return d;
}
function toArr(v){if(!v)return[];if(Array.isArray(v))return v.filter(Boolean);return Object.values(v).filter(Boolean);}
function load(key){try{const s=localStorage.getItem(key);return s?JSON.parse(s):null;}catch(e){return null;}}

function StatusBadge({status}){
  const col=status==="정상"?C.purple:status==="부상"?C.red:C.yellow;
  return <span style={{padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:700,background:col+"22",color:col,border:`1px solid ${col}44`}}>{status}</span>;
}

                      <button onClick={()=>{if(confirm("삭제할까요?"))db.ref("matches").set(matches.filter(x=>x.id!==match.id));}} style={{...btnG,flex:1,color:C.red}}>🗑️</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {tab==="stats"&&(
          <div>
            <div style={{fontSize:18,fontWeight:900,marginBottom:16}}>🏆 득점 순위</div>
            <div style={glassCard}>
              {[...members]
                .map(m=>({...m,totalGoals:getPlayerGoals(m.id)}))
                .sort((a,b)=>b.totalGoals-a.totalGoals)
                .map((m,idx)=>{
                  const medal=idx===0?"🥇":idx===1?"🥈":idx===2?"🥉":null;
                  const nameColor=idx===0?C.yellow:idx===1?"#C0C0C0":idx===2?"#CD7F32":C.sub;
                  return(
                    <div key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"13px 0",borderBottom:`1px solid rgba(59,7,100,0.6)`}}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <span style={{fontSize:14,fontWeight:900,color:nameColor,minWidth:28,textAlign:"center"}}>{medal||`${idx+1}`}</span>
                        <span style={{fontSize:15,fontWeight:700}}>{m.name}</span>
                        {m.id===myId&&<span style={{background:C.pink+"33",color:C.pink,fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:10}}>나</span>}
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:4}}>
                        <span style={{fontSize:22,fontWeight:900,color:m.totalGoals>0?C.purple:C.dim}}>{m.totalGoals}</span>
                        <span style={{fontSize:12,color:C.sub}}>골</span>
                      </div>
                    </div>
                  );
                })}
            </div>

            {isAdmin&&(
              <div style={{...glassCard,marginTop:14}}>
                <div style={{fontSize:13,fontWeight:700,color:C.purple,marginBottom:12}}>⚽ 골 기록 입력</div>
                <select value={goalMatch} onChange={e=>setGoalMatch(e.target.value)} style={{...iS,marginBottom:12}}>
                  <option value="">경기 선택...</option>
                  {[...matches].sort((a,b)=>b.date.localeCompare(a.date)).map(m=>(
                    <option key={m.id} value={m.id}>{m.date.slice(5).replace("-","/")} {m.opponent?"vs "+m.opponent:""}</option>
                  ))}
                </select>
                {goalMatch&&members.map(m=>{
                  const g=goals[goalMatch]?Number(goals[goalMatch][m.id]||0):0;
                  return(
                    <div key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid rgba(59,7,100,0.4)`}}>
                      <span style={{fontSize:14,fontWeight:600}}>{m.name}</span>
                      <div style={{display:"flex",gap:10,alignItems:"center"}}>
                        <button onClick={()=>{if(g<=0)return;db.ref(`goals/${goalMatch}/${m.id}`).set(g-1);}} style={{background:"rgba(60,0,100,0.5)",border:`1px solid ${C.border}`,borderRadius:8,width:32,height:32,color:C.sub,fontSize:18,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
                        <span style={{fontSize:20,fontWeight:900,color:g>0?C.purple:C.dim,minWidth:24,textAlign:"center"}}>{g}</span>
                        <button onClick={()=>db.ref(`goals/${goalMatch}/${m.id}`).set(g+1)} style={{background:`linear-gradient(135deg,${C.purple2},${C.purple})`,border:"none",borderRadius:8,width:32,height:32,color:"#fff",fontSize:18,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {tab==="manage"&&(
          <div>
            <div style={{display:"flex",background:"rgba(60,0,100,0.3)",borderRadius:14,padding:4,marginBottom:18,gap:4,border:`1px solid ${C.border}`}}>
              {[["dues","💰 회비"],["team","⚙️ 팀"]].map(([key,label])=>(
                <button key={key} onClick={()=>setManTab(key)} style={{flex:1,background:manTab===key?`linear-gradient(135deg,${C.purple2},${C.purple})`:"transparent",border:"none",borderRadius:10,padding:"9px 0",color:manTab===key?"#fff":C.sub,fontWeight:manTab===key?700:400,fontSize:13,cursor:"pointer",fontFamily:"inherit",boxShadow:manTab===key?`0 4px 15px rgba(124,58,237,0.4)`:"none"}}>{label}</button>
              ))}
            </div>

            {manTab==="dues"&&(
              <div>
                <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:14}}>
                  {MONTHS.map(m=>(<button key={m} onClick={()=>setDueMonth(m)} style={{background:dueMonth===m?`linear-gradient(135deg,${C.purple2},${C.purple})`:"rgba(60,0,100,0.3)",border:`1px solid ${dueMonth===m?"rgba(168,85,247,0.6)":C.border}`,borderRadius:20,padding:"6px 14px",color:dueMonth===m?"#fff":C.sub,fontWeight:dueMonth===m?700:400,fontSize:13,cursor:"pointer",fontFamily:"inherit",boxShadow:dueMonth===m?`0 4px 12px rgba(124,58,237,0.4)`:"none"}}>{mLabel(m)}</button>))}
                </div>
                {(()=>{const md=dues[dueMonth]||{};const pc=Object.values(md).filter(d=>d?.paid).length;const tp=Object.values(md).reduce((s,d)=>s+(d?.paid?d.amount:0),0);return(<div style={{...glassCard,marginBottom:14}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{fontSize:13,color:C.sub}}>{mLabel(dueMonth)} 납부 현황</span><span style={{fontSize:13,fontWeight:700,color:C.purple}}>{pc}/{members.length}명</span></div><div style={{background:"rgba(60,0,100,0.4)",borderRadius:99,height:6,overflow:"hidden",marginBottom:8}}><div style={{width:`${members.length?pc/members.length*100:0}%`,height:"100%",background:`linear-gradient(90deg,${C.purple2},${C.purple})`,borderRadius:99}}/></div><div style={{fontSize:12,color:C.sub}}>수령 {tp.toLocaleString()}원</div></div>);})()}
                <div style={glassCard}>
                  <div style={{fontSize:14,fontWeight:700,marginBottom:14}}>멤버별 현황</div>
                  {members.map(m=>{
                    const mdue=(dues[dueMonth]||{})[m.id]||{paid:false,amount:0};
                    const isMe=m.id===myId,isEditing=editDue===m.id&&isAdmin;
                    const dots=DOT_MONTHS.map(mo=>(dues[mo]||{})[m.id]?.paid||false);
                    return(
                      <div key={m.id} style={{borderBottom:`1px solid rgba(59,7,100,0.6)`,paddingBottom:12,marginBottom:12}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            <span style={{fontSize:14,fontWeight:700}}>{m.name}</span>
                            {m.id===ADMIN_ID&&<span style={{background:C.purple+"33",color:C.purple,fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:10}}>관리자</span>}
                            {isMe&&<span style={{background:C.pink+"33",color:C.pink,fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:10}}>나</span>}
                          </div>
                          <div style={{display:"flex",gap:6,alignItems:"center"}}>
                            <span style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700,background:mdue.paid?C.purple+"22":C.red+"22",color:mdue.paid?C.purple:C.red,border:`1px solid ${mdue.paid?C.purple+"44":C.red+"44"}`}}>{mdue.paid?"납부":"미납"}</span>
                            {isAdmin&&<button onClick={()=>{if(isEditing)setEditDue(null);else{setEditDue(m.id);setEditAmt(mdue.amount||"");setEditCustom(m.customStatus||"");}}} style={{background:"rgba(60,0,100,0.4)",border:`1px solid ${C.border}`,borderRadius:8,padding:"3px 10px",color:C.sub,fontSize:11,cursor:"pointer"}}>{isEditing?"닫기":"수정"}</button>}
                          </div>
                        </div>
                        <div style={{display:"flex",gap:5,marginBottom:4}}>{dots.map((p,i)=><div key={i} style={{width:10,height:10,borderRadius:"50%",background:p?C.purple:C.red,opacity:p?1:0.4,boxShadow:p?`0 0 6px rgba(192,132,252,0.6)`:"none"}}/>)}</div>
                        {m.status&&m.status!=="정상"&&<div style={{marginBottom:4}}><StatusBadge status={m.status}/></div>}
                        {m.customStatus&&<div style={{fontSize:12,color:C.sub,marginTop:4}}>{m.customStatus}</div>}
                        {isEditing&&(
                          <div style={{background:"rgba(60,0,100,0.4)",borderRadius:12,padding:12,marginTop:10,border:`1px solid ${C.border}`}}>
                            <div style={{display:"flex",gap:8,marginBottom:10}}>
                              <button onClick={()=>{const nd={...dues};if(!nd[dueMonth])nd[dueMonth]={};nd[dueMonth]={...nd[dueMonth],[m.id]:{paid:true,amount:DUE_AMT}};db.ref("dues").set(nd);addLog(`${m.name} ${mLabel(dueMonth)} 납부 처리`);setEditDue(null);}} style={{...btnP,flex:1,padding:"10px"}}>✅ 납부</button>
                              <button onClick={()=>{const nd={...dues};if(!nd[dueMonth])nd[dueMonth]={};nd[dueMonth]={...nd[dueMonth],[m.id]:{paid:false,amount:0}};db.ref("dues").set(nd);addLog(`${m.name} ${mLabel(dueMonth)} 미납 처리`);setEditDue(null);}} style={{...btnP,flex:1,padding:"10px",background:`linear-gradient(135deg,#b91c1c,${C.red})`}}>❌ 미납</button>
                            </div>
                            <div style={{fontSize:12,color:C.sub,marginBottom:8}}>상태</div>
                            <div style={{display:"flex",gap:8,marginBottom:10}}>
                              {["정상","부상","휴식"].map(s=>{const col=s==="정상"?C.purple:s==="부상"?C.red:C.yellow;return(<button key={s} onClick={()=>{db.ref("members").set(members.map(p=>p.id===m.id?{...p,status:s}:p));addLog(`${m.name} 상태 → ${s}`);}} style={{flex:1,background:m.status===s?col+"33":"rgba(60,0,100,0.3)",border:`1px solid ${m.status===s?col+"66":C.border}`,borderRadius:10,padding:"7px",color:m.status===s?col:C.sub,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{s}</button>);})}
                            </div>
                            <div style={{display:"flex",gap:8}}>
                              <input value={editCustom} onChange={e=>setEditCustom(e.target.value)} placeholder="직접입력" style={{...iS,flex:1}}/>
                              <button onClick={()=>db.ref("members").set(members.map(p=>p.id===m.id?{...p,customStatus:editCustom}:p))} style={{...btnP,width:"auto",padding:"10px 14px"}}>적용</button>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {manTab==="team"&&(
              <div>
                {!isAdmin?(<div style={{...glassCard,textAlign:"center",padding:"30px 20px"}}><div style={{fontSize:32,marginBottom:12}}>🔒</div><div style={{fontSize:14,fontWeight:700,marginBottom:6}}>관리자 전용</div><div style={{fontSize:12,color:C.sub}}>팀 관리는 관리자만 접근 가능합니다</div></div>):(
                  <>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                      <span style={{fontSize:13,color:C.sub}}>멤버 목록</span>
                      <div style={{display:"flex",gap:8}}>
                        <button onClick={()=>{if(confirm("멤버를 기본 18명으로 초기화할까요?\n기존 데이터는 사라집니다.")){db.ref("members").set(INIT_MEMBERS);addLog("멤버 초기화 완료");}}} style={{background:C.red+"22",border:`1px solid ${C.red}44`,borderRadius:20,padding:"7px 14px",color:C.red,fontSize:12,fontWeight:700,cursor:"pointer"}}>초기화</button>
                        <button onClick={()=>setAddMember(!addMember)} style={{...btnP,width:"auto",padding:"7px 16px",fontSize:12,borderRadius:20}}>+ 멤버 추가</button>
                      </div>
                    </div>
                    {addMember&&<div style={{...glassCard,marginBottom:12}}><div style={{display:"flex",gap:8}}><input value={newMemberName} onChange={e=>setNewMemberName(e.target.value)} placeholder="이름 입력" style={{...iS,flex:1}}/><button onClick={()=>{if(!newMemberName.trim())return;const nm={id:Date.now(),name:newMemberName,status:"정상",customStatus:""};db.ref("members").set([...members,nm]);const nd={...dues};MONTHS.forEach(m=>{if(!nd[m])nd[m]={};nd[m][nm.id]={paid:false,amount:0};});db.ref("dues").set(nd);addLog(`멤버 추가: ${newMemberName}`);setNewMemberName("");setAddMember(false);}} style={{...btnP,width:"auto",padding:"10px 14px"}}>추가</button><button onClick={()=>setAddMember(false)} style={{...btnG,width:"auto",padding:"10px 12px"}}>취소</button></div></div>}
                    <div style={glassCard}>
                      {members.map(m=>(<div key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 0",borderBottom:`1px solid rgba(59,7,100,0.6)`}}>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <span style={{fontSize:15,fontWeight:600}}>{m.name}</span>
                          {m.id===ADMIN_ID&&<span style={{background:C.purple+"33",color:C.purple,fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:10}}>관리자</span>}
                          {m.id===myId&&<span style={{background:C.pink+"33",color:C.pink,fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:10}}>나</span>}
                          {m.status&&m.status!=="정상"&&<StatusBadge status={m.status}/>}
                        </div>
                        {m.id!==ADMIN_ID&&<button onClick={()=>{if(confirm(`${m.name}님을 삭제할까요?`)){db.ref("members").set(members.filter(x=>x.id!==m.id));addLog(`멤버 삭제: ${m.name}`);}}} style={{background:C.red+"22",border:`1px solid ${C.red}44`,borderRadius:10,padding:"4px 12px",color:C.red,fontSize:12,fontWeight:700,cursor:"pointer"}}>삭제</button>}
                      </div>))}
                    </div>
                  </>
                )}
              </div>
            )}
          </div>
        )}
